const CV={};['Beaker','Curve','Species','Meters'].forEach(n=>{const el=$('cv'+n);CV[n.toLowerCase()]={el,ctx:el.getContext('2d'),w:0,h:0,dpr:1};});
function sizeCv(c){
  const w=c.el.clientWidth,h=c.el.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  if(w!==c.w||h!==c.h||dpr!==c.dpr){c.w=w;c.h=h;c.dpr=dpr;c.el.width=Math.max(1,Math.round(w*dpr));c.el.height=Math.max(1,Math.round(h*dpr));}
  c.ctx.setTransform(dpr,0,0,dpr,0,0);return w>0&&h>0;
}
function rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function pill(ctx,text,x,y,o={}){
  ctx.save();ctx.font='500 12px Inter, sans-serif';const w=ctx.measureText(text).width+20,h=24;
  let px=x,py=y;const an=o.anchor||'tl';
  if(an==='bl')py=y-h; if(an==='br'){px=x-w;py=y-h;} if(an==='tr')px=x-w;
  rr(ctx,px,py,w,h,12);ctx.fillStyle='rgba(20,20,20,0.86)';ctx.fill();
  ctx.fillStyle=o.color||C.cream;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(text,px+10,py+h/2+0.5);ctx.restore();
}
function drawP(ctx,p,X,Y,rp,tag){
  const t=TY[p.type];ctx.globalAlpha=clamp(p.a,0,1);
  ctx.beginPath();ctx.arc(X,Y,rp,0,6.2832);
  if(t.sp){ctx.fillStyle='rgba(253,249,240,0.05)';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=t.stroke;ctx.stroke();}
  else{ctx.fillStyle=t.fill;ctx.fill();}
  if(t.pr){const sx=X+Math.cos(p.ang)*rp*0.92,sy=Y+Math.sin(p.ang)*rp*0.92;ctx.beginPath();ctx.arc(sx,sy,Math.max(2.2,rp*0.32),0,6.2832);ctx.fillStyle=C.cream;ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle=C.ink;ctx.stroke();}
  if(rp>=10){ctx.fillStyle=t.sp?'rgba(253,249,240,0.8)':C.ink;ctx.font=`700 ${Math.round(rp*0.6)}px Inter, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.lab,X,Y+0.5);}
  if(tag){ctx.beginPath();ctx.arc(X,Y,rp+5,0,6.2832);ctx.lineWidth=2.5;ctx.strokeStyle=C.lime;ctx.stroke();}
  ctx.globalAlpha=1;
}
function layoutSims(sc,w,h){
  const pad=10,gap=10,S=sc.sims;if(!S.length)return;
  if(S.length===1){S[0].setRect(pad,pad,w-2*pad,h-2*pad);return;}
  if(w>=h*1.1){const sw=(w-2*pad-gap)/2;S[0].setRect(pad,pad,sw,h-2*pad);S[1].setRect(pad+sw+gap,pad,sw,h-2*pad);}
  else{const sh=(h-2*pad-gap)/2;S[0].setRect(pad,pad,w-2*pad,sh);S[1].setRect(pad,pad+sh+gap,w-2*pad,sh);}
}
function drawBeaker(){
  const c=CV.beaker,sc=state.scene;if(!sizeCv(c))return;const ctx=c.ctx;ctx.clearRect(0,0,c.w,c.h);
  layoutSims(sc,c.w,c.h);
  for(const s of sc.sims){
    const r=s.rect,S=r.h,rp=s.R()*S;
    ctx.save();rr(ctx,r.x,r.y,r.w,r.h,18);ctx.fillStyle=C.ink2;ctx.fill();ctx.clip();
    if(sc.titr){const col=sc.titr.indColor();if(col){ctx.fillStyle=col;ctx.fillRect(r.x,r.y,r.w,r.h);}}
    ctx.fillStyle='rgba(253,249,240,0.09)';
    for(const d of s.water){ctx.beginPath();ctx.arc(r.x+d.x*r.w,r.y+d.y*r.h,1.3,0,6.2832);ctx.fill();}
    if(s.membrane)drawMembrane(ctx,s,r);
    for(const p of s.p)drawP(ctx,p,r.x+p.x*S,r.y+p.y*S,rp,p.id===s.tagged);
    for(const f of s.fx){
      const k=f.t/f.d;
      if(f.k==='hop'){const e=1-(1-k)*(1-k);const x=r.x+(f.x0+(f.x1-f.x0)*e)*S,y=r.y+(f.y0+(f.y1-f.y0)*e)*S;
        ctx.beginPath();ctx.arc(x,y,Math.max(2.5,rp*0.36),0,6.2832);ctx.fillStyle=C.cream;ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle=C.ink;ctx.stroke();}
      else if(f.k==='flash'){const x=r.x+f.x*S,y=r.y+f.y*S;ctx.globalAlpha=(1-k)*0.85;ctx.beginPath();ctx.arc(x,y,rp*(1+2.2*k),0,6.2832);ctx.lineWidth=2;ctx.strokeStyle=C.cream;ctx.stroke();
        ctx.font='700 12px Inter, sans-serif';ctx.textAlign='center';ctx.fillStyle=C.cream;ctx.fillText(f.text,x,y-rp*1.7-k*14);ctx.globalAlpha=1;}
      else if(f.k==='pulse'){const p=s.byId(f.id);if(p){ctx.globalAlpha=(1-k)*0.8;ctx.beginPath();ctx.arc(r.x+p.x*S,r.y+p.y*S,rp*(1+0.9*k),0,6.2832);ctx.lineWidth=2;ctx.strokeStyle=C.cream;ctx.stroke();ctx.globalAlpha=1;}}
    }
    ctx.restore();
    if(s.label)pill(ctx,s.label,r.x+12,r.y+12);
    if(sc.overlay)sc.overlay(ctx,s,r);
  }
  if(sc.lens&&sc.lens.on&&sc.rare)drawLens(ctx,sc,sc.sims[0].rect);
}
function drawMembrane(ctx,s,r){
  const y0=r.y+s.membrane[0]*r.h,y1=r.y+s.membrane[1]*r.h;
  ctx.fillStyle='rgba(204,204,255,0.07)';ctx.fillRect(r.x,y0,r.w,y1-y0);
  const sp=10,hr=3.4;ctx.strokeStyle='rgba(204,204,255,0.35)';ctx.fillStyle='rgba(204,204,255,0.5)';ctx.lineWidth=1;
  for(let x=r.x+sp/2;x<r.x+r.w;x+=sp){
    ctx.beginPath();ctx.arc(x,y0+hr,hr,0,6.2832);ctx.fill();ctx.beginPath();ctx.arc(x,y1-hr,hr,0,6.2832);ctx.fill();
    const mid=(y0+y1)/2;ctx.beginPath();ctx.moveTo(x-1.5,y0+2*hr);ctx.lineTo(x-1.5,mid-2);ctx.moveTo(x+1.5,y0+2*hr);ctx.lineTo(x+1.5,mid-2);
    ctx.moveTo(x-1.5,y1-2*hr);ctx.lineTo(x-1.5,mid+2);ctx.moveTo(x+1.5,y1-2*hr);ctx.lineTo(x+1.5,mid+2);ctx.stroke();
  }
}
const LENS_DOTS=[],LENS_IONS=[];
for(let i=0;i<300;i++){const a=rnd()*6.283,d=Math.sqrt(rnd())*0.96;LENS_DOTS.push([Math.cos(a)*d,Math.sin(a)*d]);}
(function(){let tries=0;while(LENS_IONS.length<12&&tries<4000){tries++;const a=rnd()*6.283,d=Math.sqrt(rnd())*0.7;const q=[Math.cos(a)*d,Math.sin(a)*d];
  if(LENS_IONS.every(o=>Math.hypot(o[0]-q[0],o[1]-q[1])>0.3))LENS_IONS.push(q);}})();
function drawLens(ctx,sc,r){
  const rare=sc.rare();let sp=sc.lens.sp;
  if(sp==='auto'){const cand=['H3O','OH'].filter(k=>rare[k]>0&&rare[k]<1).sort((a,b)=>rare[b]-rare[a]);sp=cand[0]||null;}
  const R=Math.min(r.w,r.h)*0.23,cx=r.x+r.w-R-16,cy=r.y+r.h-R-16;
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,6.2832);ctx.fillStyle=C.ink;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=C.cream;ctx.stroke();ctx.clip();
  ctx.fillStyle='rgba(253,249,240,0.17)';for(const d of LENS_DOTS){ctx.beginPath();ctx.arc(cx+d[0]*R,cy+d[1]*R,1.1,0,6.2832);ctx.fill();}
  let caption,sub;
  if(!sp){caption='Trace lens';sub='No rare ions';}
  else if(!(rare[sp]<1)){caption='Trace lens';sub=`${TY[sp].lab} visible in beaker`;}
  else{
    const x=rare[sp],n=Math.max(1,Math.ceil(Math.log10(1/x)-1e-9)),mE=x*Math.pow(10,n),m=Math.min(12,Math.floor(mE+state.lensU));
    const ir=Math.max(6,R*0.12);
    for(let i=0;i<m;i++){const q=LENS_IONS[i];if(!q)break;drawP(ctx,{type:sp,a:1,ang:i*1.7},cx+q[0]*R,cy+q[1]*R,ir,false);}
    caption=`Trace lens · ×10${sup(n)} volume`;sub=`≈ ${mE<9.95?mE.toFixed(1):Math.round(mE)} ${TY[sp].lab} in this sample`;
  }
  ctx.restore();
  const lx=cx-R-10,ly=cy+R;
  pill(ctx,caption,lx,ly-30,{anchor:'br'});pill(ctx,sub,lx,ly,{anchor:'br',color:'rgba(253,249,240,0.75)'});
}
function axisText(ctx,t,x,y,align='left',base='alphabetic',alpha=0.45){ctx.fillStyle=`rgba(253,249,240,${alpha})`;ctx.font='500 11px Inter, sans-serif';ctx.textAlign=align;ctx.textBaseline=base;ctx.fillText(t,x,y);}
function title(ctx,t,x=14,y=20){ctx.fillStyle='rgba(253,249,240,0.5)';ctx.font='700 10.5px Inter, sans-serif';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText(t.toUpperCase(),x,y);}
function drawCurve(){
  const c=CV.curve,sc=state.scene,t=sc.titr;if(!t||!sizeCv(c))return;const ctx=c.ctx,w=c.w,h=c.h;ctx.clearRect(0,0,w,h);
  const Lp=38,Rp=16,Tp=34,Bp=30,pw=w-Lp-Rp,ph=h-Tp-Bp;const X=v=>Lp+v/t.Vmax*pw,Y=p=>Tp+(1-clamp(p,0,14)/14)*ph;
  title(ctx,'pH curve');
  const I=IND[t.ind];
  if(I&&I.pKa!=null){const ca=I.ca||[253,249,240],cb=I.cb;const g=ctx.createLinearGradient(0,Y(I.lo),0,Y(I.hi));
    g.addColorStop(0,`rgba(${ca[0]},${ca[1]},${ca[2]},${I.ca?0.28:0.05})`);g.addColorStop(1,`rgba(${cb[0]},${cb[1]},${cb[2]},0.28)`);
    ctx.fillStyle=g;ctx.fillRect(Lp,Y(I.hi),pw,Y(I.lo)-Y(I.hi));axisText(ctx,I.name,Lp+pw-4,Y(I.hi)-4,'right','alphabetic',0.6);}
  ctx.lineWidth=1;
  for(let p=0;p<=14;p+=2){ctx.strokeStyle=p===7?'rgba(253,249,240,0.22)':'rgba(253,249,240,0.07)';ctx.beginPath();ctx.moveTo(Lp,Y(p));ctx.lineTo(Lp+pw,Y(p));ctx.stroke();axisText(ctx,String(p),Lp-8,Y(p)+4,'right');}
  const step=t.Vmax/5;for(let i=0;i<=5;i++){const v=step*i;axisText(ctx,v>=10?v.toFixed(0):v.toFixed(1),X(v),h-Bp+16,'center');}
  axisText(ctx,`mL ${t.def.titrant}`,Lp+pw,h-6,'right','alphabetic',0.35);
  ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(253,249,240,0.4)';ctx.beginPath();ctx.moveTo(X(t.Veq),Tp);ctx.lineTo(X(t.Veq),Tp+ph);ctx.stroke();ctx.setLineDash([]);
  axisText(ctx,'equivalence',X(t.Veq)+5,Tp+10,'left','alphabetic',0.6);
  ctx.strokeStyle=C.cream;ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.beginPath();let started=false;
  for(const [v,p] of t.curve){if(v>t.Vt)break;if(!started){ctx.moveTo(X(v),Y(p));started=true;}else ctx.lineTo(X(v),Y(p));}
  const st=t.cur();if(started)ctx.lineTo(X(t.Vt),Y(st.pH));ctx.stroke();
  const weak=t.def.kind==='WA'||t.def.kind==='WB';
  if(weak&&t.Vt>=t.Veq/2){const pp=t.state(t.Veq/2).pH;ctx.fillStyle=C.violet;ctx.beginPath();ctx.arc(X(t.Veq/2),Y(pp),4.5,0,6.2832);ctx.fill();
    axisText(ctx,t.def.kind==='WA'?'½ eq: pH = pKa':'½ eq: pH = pKa(NH₄⁺)',X(t.Veq/2)+8,Y(pp)+(t.rising?16:-8),'left','alphabetic',0.7);}
  if(t.ep!=null&&t.Vt>=t.ep&&I&&I.cb){const pe=t.state(t.ep).pH;ctx.fillStyle=`rgb(${I.cb.join(',')})`;ctx.beginPath();ctx.arc(X(t.ep),Y(pe),5,0,6.2832);ctx.fill();
    axisText(ctx,'end point',X(t.ep)+8,Y(pe)+(t.rising?-8:16),'left','alphabetic',0.8);}
  ctx.beginPath();ctx.arc(X(t.Vt),Y(st.pH),6,0,6.2832);ctx.fillStyle=C.cream;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=C.ink;ctx.stroke();
}
function drawSpecies(){
  const c=CV.species,sc=state.scene;if(!sc.species||!sizeCv(c))return;const ctx=c.ctx,w=c.w,h=c.h;ctx.clearRect(0,0,w,h);
  title(ctx,state.logSpecies?'Species · mol/L (log)':'Species · mol/L');
  const vals=sc.speciesVals(),L=sc.species,Lp=42,Rp=14,Tp=50,Bp=34,pw=w-Lp-Rp,ph=h-Tp-Bp;
  const lg=state.logSpecies,maxV=Math.max(1e-9,...L.map(k=>vals[k]||0));
  const Y=v=>{if(lg){const e=v>0?clamp(Math.log10(v),-14,0):-14;return Tp+ph*(-e/14);}return Tp+ph*(1-v/(maxV*1.15));};
  ctx.lineWidth=1;
  if(lg){for(let e=0;e>=-14;e-=2){ctx.strokeStyle='rgba(253,249,240,0.07)';ctx.beginPath();ctx.moveTo(Lp,Y(Math.pow(10,e)));ctx.lineTo(Lp+pw,Y(Math.pow(10,e)));ctx.stroke();axisText(ctx,e===0?'1':'10'+sup(e),Lp-6,Y(Math.pow(10,e))+4,'right');}}
  else{ctx.strokeStyle='rgba(253,249,240,0.12)';ctx.beginPath();ctx.moveTo(Lp,Tp+ph);ctx.lineTo(Lp+pw,Tp+ph);ctx.stroke();axisText(ctx,sci(maxV*1.15,1),Lp-6,Tp+4,'right');axisText(ctx,'0',Lp-6,Tp+ph+4,'right');}
  const bw=Math.min(54,pw/L.length*0.6),gap=pw/L.length;
  L.forEach((k,i)=>{const v=vals[k]||0,x=Lp+gap*i+(gap-bw)/2,y=Y(v),ty=TY[k];const hh=Tp+ph-y;
    if(hh>0.5){rr(ctx,x,y,bw,hh,Math.min(8,bw/2,hh/2));if(ty.sp){ctx.lineWidth=1.5;ctx.strokeStyle=ty.stroke;ctx.stroke();}else{ctx.fillStyle=ty.fill;ctx.fill();}}
    axisText(ctx,ty.lab,x+bw/2,Tp+ph+18,'center','alphabetic',0.75);
    axisText(ctx,sci(v,1),x+bw/2,y-6,'center','alphabetic',0.7);});
}
function rates(s){const span=Math.min(8,Math.max(1,s.t));return [s.fwd.length/span,s.rev.length/span];}
function qk(s){
  const H=s.hist.slice(-24);if(!H.length||!s.kin||!s.kin.kr)return null;
  let ha=0,a=0,h=0;for(const e of H){ha+=e.HA;a+=e.A;h+=e.H3O;}ha/=H.length;a/=H.length;h/=H.length;
  if(ha<1e-9&&h*a<1e-9)return null;if(ha<1e-9)return Infinity;
  return (h*a/(ha*s.dil))/(s.kin.kf/s.kin.kr);
}
function drawMeters(){
  const c=CV.meters,sc=state.scene;if(!sc.meters||!sizeCv(c))return;const ctx=c.ctx,w=c.w,h=c.h;ctx.clearRect(0,0,w,h);
  const mode=sc.meters.mode,wide=w>=560;
  if(mode==='counts'){drawCounts(ctx,{x:14,y:10,w:w-28,h:h-20},sc.sims[0],sc.meters.types);return;}
  let boxes;
  if(mode==='eq'){
    if(wide){const cw=(w-56)/3;boxes=[0,1,2].map(i=>({x:14+i*(cw+14),y:10,w:cw,h:h-20}));}
    else{const rh=(h-40)/3;boxes=[0,1,2].map(i=>({x:14,y:10+i*(rh+10),w:w-28,h:rh}));}
    drawRates(ctx,boxes[0],sc.sims[0]);drawGauge(ctx,boxes[1],sc.sims);drawHist(ctx,boxes[2],sc.sims);
  } else {
    if(wide){const cw=(w-42)*0.6;boxes=[{x:14,y:10,w:cw,h:h-20},{x:28+cw,y:10,w:w-42-cw,h:h-20}];}
    else{const rh=(h-30)/2;boxes=[{x:14,y:10,w:w-28,h:rh},{x:14,y:20+rh,w:w-28,h:rh}];}
    drawHist(ctx,boxes[0],sc.sims);drawGauge(ctx,boxes[1],sc.sims);
  }
}
function drawRates(ctx,b,s){
  title(ctx,'Reaction rate · events per second',b.x,b.y+12);
  const [f,r]=rates(s),mx=Math.max(3,f,r)*1.15,bh=Math.min(16,b.h*0.14),bw=b.w-4;
  [['Forward · ionising',f,C.cream],['Reverse · recombining',r,C.lilac]].forEach(([lab,v,col],i)=>{
    const y=b.y+30+i*(bh+30);axisText(ctx,lab,b.x,y,'left','alphabetic',0.6);axisText(ctx,v.toFixed(1),b.x+bw,y,'right','alphabetic',0.85);
    rr(ctx,b.x,y+6,bw,bh,bh/2);ctx.fillStyle='rgba(253,249,240,0.07)';ctx.fill();
    if(v>0){rr(ctx,b.x,y+6,Math.max(bh,bw*v/mx),bh,bh/2);ctx.fillStyle=col;ctx.fill();}
  });
}
function drawGauge(ctx,b,sims){
  title(ctx,'Q vs K',b.x,b.y+12);
  const y=b.y+b.h*0.55,x0=b.x+6,x1=b.x+b.w-6,X=v=>x0+(clamp(v,-2,2)+2)/4*(x1-x0);
  ctx.strokeStyle='rgba(253,249,240,0.25)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
  [-2,-1,0,1,2].forEach(e=>{ctx.strokeStyle=e===0?C.cream:'rgba(253,249,240,0.3)';ctx.lineWidth=e===0?2:1;ctx.beginPath();ctx.moveTo(X(e),y-(e===0?10:5));ctx.lineTo(X(e),y+(e===0?10:5));ctx.stroke();
    axisText(ctx,e===0?'K':(e<0?`K/${Math.pow(10,-e)}`:`${Math.pow(10,e)}K`),X(e),y+24,'center','alphabetic',e===0?0.85:0.4);});
  let status='';
  sims.forEach((s,i)=>{const q=qk(s);if(q===null){if(i===0)status='No acid present';return;}
    const lv=q===Infinity?2:(q<=0?-2:Math.log10(q));const xx=X(lv);ctx.fillStyle=i===0?C.cream:C.violet;
    ctx.beginPath();ctx.moveTo(xx,y-6);ctx.lineTo(xx-7,y-18);ctx.lineTo(xx+7,y-18);ctx.closePath();ctx.fill();
    if(i===0)status=Math.abs(lv)<0.4?'Q ≈ K · at equilibrium':(lv<0?'Q < K · forward wins':'Q > K · reverse wins');});
  axisText(ctx,status,b.x,b.y+30,'left','alphabetic',0.85);
  if(sims.length>1){axisText(ctx,'▲ left   ',b.x+b.w,b.y+12,'right','alphabetic',0.8);ctx.fillStyle=C.violet;ctx.font='500 11px Inter, sans-serif';ctx.textAlign='right';ctx.fillText('▲ right',b.x+b.w-50,b.y+12);}
}
function drawHist(ctx,b,sims){
  title(ctx,'A⁻ ions over the last 60 s',b.x,b.y+12);
  const T=b.y+24,H=b.h-34,Wd=b.w;let mx=6;sims.forEach(s=>s.hist.forEach(e=>{if(e.A>mx)mx=e.A;}));mx=Math.ceil(mx*1.15);
  ctx.strokeStyle='rgba(253,249,240,0.12)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(b.x,T+H);ctx.lineTo(b.x+Wd,T+H);ctx.stroke();
  axisText(ctx,String(mx),b.x+Wd,T+8,'right','alphabetic',0.4);
  sims.forEach((s,i)=>{if(!s.hist.length)return;const tN=s.t,span=clamp(tN,10,60);ctx.strokeStyle=i===0?C.cream:C.violet;ctx.lineWidth=2;ctx.beginPath();
    s.hist.forEach((e,j)=>{const x=b.x+Wd*(1-(tN-e.t)/span),y=T+H*(1-e.A/mx);if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();});
}
function drawCounts(ctx,b,s,types){
  title(ctx,'Particle counts',b.x,b.y+12);const c=s.raw();const rows=types.map(t=>[TY[t].lab,c[t]||0,TY[t]]).concat([['H₂O formed',s.h2o,null]]);
  const mx=Math.max(24,...rows.map(r=>r[1])),rh=Math.min(30,(b.h-30)/rows.length),bw=b.w-130;
  rows.forEach(([lab,v,ty],i)=>{const y=b.y+28+i*rh;axisText(ctx,lab,b.x,y+rh*0.55,'left','middle',0.75);axisText(ctx,String(v),b.x+80,y+rh*0.55,'left','middle',0.9);
    const bh=Math.min(12,rh*0.5);rr(ctx,b.x+118,y+rh*0.55-bh/2,bw,bh,bh/2);ctx.fillStyle='rgba(253,249,240,0.06)';ctx.fill();
    if(v>0){rr(ctx,b.x+118,y+rh*0.55-bh/2,Math.max(bh,bw*Math.min(1,v/mx)),bh,bh/2);if(ty&&ty.sp){ctx.lineWidth=1.5;ctx.strokeStyle=ty.stroke;ctx.stroke();}else{ctx.fillStyle=ty?ty.fill:C.cream;ctx.fill();}}});
}

/* ════════════════════════════════════════════════════════════
   LOOP
   ════════════════════════════════════════════════════════════ */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const sc=state.scene;
  if(sc){
    state.lensT+=dt;if(state.lensT>1.1){state.lensT=0;state.lensU=rnd();}
    if(!sc.paused){const sdt=dt*sc.timeScale;sc.drivers.forEach(d=>d.step(sdt));sc.sims.forEach(s=>s.step(sdt));}
    sc.tick(dt);
    const vis=p=>document.querySelector(`.pane[data-pane="${p}"]`).style.display!=='none';
    if(vis('beaker'))drawBeaker();if(vis('curve'))drawCurve();if(vis('species'))drawSpecies();if(vis('meters'))drawMeters();
  }
  requestAnimationFrame(frame);
}
renderAll(false);
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
window.__lab={state,STEPS,Titr,AN,loadScene,renderAll};
})();
</script>
